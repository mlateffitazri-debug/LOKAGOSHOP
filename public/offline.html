<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiada Sambungan — LokalGo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, sans-serif; }
    .card { background: #1a1a1a; border-radius: 24px; padding: 40px 32px; max-width: 340px; text-align: center; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { color: #fff; font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    p { color: #888; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    button { background: #7B1533; color: #fff; border: none; border-radius: 12px; padding: 12px 28px; font-size: 14px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Tiada Sambungan Internet</h1>
    <p>Sila semak sambungan internet anda dan cuba lagi.</p>
    <button onclick="window.location.reload()">Cuba Semula</button>
  </div>
</body>
</html>
